services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: access_dashboard
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - access_pg:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/access_dashboard
      FRONTEND_ORIGIN: http://localhost:8000
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/callback
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy

volumes:
  access_pg:
