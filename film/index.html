<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Tenant Access film</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Schibsted Grotesk";
        src: url("assets/fonts/SchibstedGrotesk-latin-var.woff2") format("woff2");
        font-weight: 400 900;
        font-style: normal;
      }
      :root {
        --ground: #f0f2f2;
        --ink: #111418;
        --muted: #5f6670;
        --danger: #b42318;
        --font-display: "Schibsted Grotesk", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--ground);
        font-family: var(--font-display);
      }
      #demo {
        z-index: 1;
      }
      #endcard {
        z-index: 2;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="25"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="demo"
        data-composition-id="demo"
        data-composition-src="compositions/demo.html"
        data-variable-values='{"lang":"en"}'
        data-start="0"
        data-duration="21.3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-variable-values='{"lang":"en"}'
        data-start="21.2"
        data-duration="3.8"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
