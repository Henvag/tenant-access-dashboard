<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Tenant Access: sign-in and access control for self-hosted tools</title>
    <meta name="description" content="Your team signs in with Google or Microsoft. You decide who may open Grafana, Outline, Gitea and the other tools your company hosts. Made for small companies, in English and Norwegian." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tenant Access" />
    <meta property="og:title" content="Tenant Access" />
    <meta property="og:description" content="Sign-in and access control for the tools you run yourself." />
    <meta property="og:url" content="https://tenantaccess.me/" />
    <meta property="og:image" content="https://tenantaccess.me/og-image.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // A visitor who chose Norwegian, or whose browser is Norwegian, opens the Norwegian
      // address before anything is drawn. Same check as detectLang() in src/i18n.tsx.
      (function () {
        var pairs = { "/": "/no", "/privacy": "/personvern" };
        var to = pairs[location.pathname];
        if (!to) return;
        var lang = null;
        try { lang = localStorage.getItem("tenant-access.lang"); } catch (e) {}
        if (lang !== "en" && lang !== "no") lang = /^(nb|nn|no)\b/i.test(navigator.language || "") ? "no" : "en";
        if (lang === "no") location.replace(to + location.search + location.hash);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
