# Same Docker image as Render — second hosting model for the portfolio story.
# Deploy: install flyctl → fly auth login → fly launch --no-deploy (or use this file) → set secrets → fly deploy
#
# App name must be unique on Fly; change `app` if taken.

app = 'tenant-access-dashboard'
primary_region = 'arn'

[build]
  dockerfile = 'Dockerfile'

[env]
  ENVIRONMENT = 'production'
  ENTRA_TENANT_ID = 'common'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
