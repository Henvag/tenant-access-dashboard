services:
  - type: web
    name: tenant-access-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tenant-access-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Custom domain behind Cloudflare (see docs/cloudflare.md). Until set, Render's
      # RENDER_EXTERNAL_URL remains the OIDC issuer / Google+Entra callback base.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: ENTRA_CLIENT_SECRET
        sync: false
      - key: ENTRA_TENANT_ID
        value: common
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_TEAM_MONTHLY
        sync: false
      - key: STRIPE_PRICE_BUSINESS_MONTHLY
        sync: false
      - key: STRIPE_PRICE_TEAM_ANNUAL
        sync: false
      - key: STRIPE_PRICE_BUSINESS_ANNUAL
        sync: false
      - key: STRIPE_VIPPS_ENABLED
        value: "false"

  # Demo relying party: Grafana signs in through the dashboard (OIDC provider).
  # Register "Grafana" under Apps in the dashboard, then paste the client id/secret here.
  - type: web
    name: tenant-access-grafana
    runtime: image
    plan: free
    image:
      url: docker.io/grafana/grafana-oss:11.4.0
    healthCheckPath: /api/health
    envVars:
      - key: GF_SERVER_HTTP_PORT
        value: "10000"
      - key: GF_SERVER_ROOT_URL
        value: https://tenant-access-grafana.onrender.com
      - key: GF_AUTH_DISABLE_LOGIN_FORM
        value: "true"
      - key: GF_AUTH_GENERIC_OAUTH_ENABLED
        value: "true"
      - key: GF_AUTH_GENERIC_OAUTH_NAME
        value: Tenant Access
      - key: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
        sync: false
      - key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
        sync: false
      - key: GF_AUTH_GENERIC_OAUTH_SCOPES
        value: openid email profile
      - key: GF_AUTH_GENERIC_OAUTH_AUTH_URL
        value: https://tenant-access-dashboard.onrender.com/oauth/authorize
      - key: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
        value: https://tenant-access-dashboard.onrender.com/oauth/token
      - key: GF_AUTH_GENERIC_OAUTH_API_URL
        value: https://tenant-access-dashboard.onrender.com/oauth/userinfo
      - key: GF_AUTH_GENERIC_OAUTH_USE_PKCE
        value: "true"
      - key: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
        value: "true"
      - key: GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH
        value: email
      - key: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
        value: email
      - key: GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH
        value: name
      # owner → Admin, promoted admin → Editor, member → Viewer
      - key: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
        value: "role == 'owner' && 'Admin' || role == 'admin' && 'Editor' || 'Viewer'"
      - key: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT
        value: "true"
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      - key: GF_ANALYTICS_REPORTING_ENABLED
        value: "false"
      - key: GF_ANALYTICS_CHECK_FOR_UPDATES
        value: "false"

  # Outline wiki (OIDC RP). Uses Redis + a dedicated `outline` DB on tenant-access-db
  # (entrypoint rewrites DATABASE_URL). Register redirect …/auth/oidc.callback, paste secrets.
  - type: web
    name: tenant-access-outline
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.outline
    dockerContext: .
    healthCheckPath: /_health
    envVars:
      - key: URL
        value: https://tenant-access-outline.onrender.com
      - key: FORCE_HTTPS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: UTILS_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: tenant-access-db
          property: connectionString
      - key: PGSSLMODE
        value: require
      - key: REDIS_URL
        fromService:
          name: tenant-access-outline-redis
          type: keyvalue
          property: connectionString
      - key: FILE_STORAGE
        value: local
      - key: FILE_STORAGE_LOCAL_ROOT_DIR
        value: /var/lib/outline/data
      - key: FILE_STORAGE_UPLOAD_MAX_SIZE
        value: "26214400"
      - key: OIDC_CLIENT_ID
        sync: false
      - key: OIDC_CLIENT_SECRET
        sync: false
      - key: OIDC_AUTH_URI
        value: https://tenant-access-dashboard.onrender.com/oauth/authorize
      - key: OIDC_TOKEN_URI
        value: https://tenant-access-dashboard.onrender.com/oauth/token
      - key: OIDC_USERINFO_URI
        value: https://tenant-access-dashboard.onrender.com/oauth/userinfo
      - key: OIDC_DISPLAY_NAME
        value: Tenant Access
      - key: OIDC_SCOPES
        value: openid profile email
      - key: OIDC_USERNAME_CLAIM
        value: email
      # Free instances are ~512MB; keep a single worker and cap V8 heap.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=384"
      - key: ENABLE_UPDATES
        value: "false"

  - type: keyvalue
    name: tenant-access-outline-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: tenant-access-db
    plan: free
    postgresMajorVersion: "16"
