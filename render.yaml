services:
  - type: web
    name: tenant-access-dashboard
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tenant-access-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: ENTRA_CLIENT_SECRET
        sync: false
      - key: ENTRA_TENANT_ID
        value: common

  # Demo relying party: Grafana signs in through the dashboard (OIDC provider).
  # Register "Grafana" under Apps in the dashboard, then paste the client id/secret here.
  - type: web
    name: tenant-access-grafana
    runtime: image
    plan: free
    image:
      url: docker.io/grafana/grafana-oss:11.4.0
    healthCheckPath: /api/health
    envVars:
      - key: GF_SERVER_HTTP_PORT
        value: "10000"
      - key: GF_SERVER_ROOT_URL
        value: https://tenant-access-grafana.onrender.com
      - key: GF_AUTH_DISABLE_LOGIN_FORM
        value: "true"
      - key: GF_AUTH_GENERIC_OAUTH_ENABLED
        value: "true"
      - key: GF_AUTH_GENERIC_OAUTH_NAME
        value: Tenant Access
      - key: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
        sync: false
      - key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
        sync: false
      - key: GF_AUTH_GENERIC_OAUTH_SCOPES
        value: openid email profile
      - key: GF_AUTH_GENERIC_OAUTH_AUTH_URL
        value: https://tenant-access-dashboard.onrender.com/oauth/authorize
      - key: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
        value: https://tenant-access-dashboard.onrender.com/oauth/token
      - key: GF_AUTH_GENERIC_OAUTH_API_URL
        value: https://tenant-access-dashboard.onrender.com/oauth/userinfo
      - key: GF_AUTH_GENERIC_OAUTH_USE_PKCE
        value: "true"
      - key: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
        value: "true"
      - key: GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH
        value: email
      - key: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH
        value: email
      - key: GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH
        value: name
      # owner → Admin, promoted admin → Editor, member → Viewer
      - key: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
        value: "role == 'owner' && 'Admin' || role == 'admin' && 'Editor' || 'Viewer'"
      - key: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT
        value: "true"
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      - key: GF_ANALYTICS_REPORTING_ENABLED
        value: "false"
      - key: GF_ANALYTICS_CHECK_FOR_UPDATES
        value: "false"

databases:
  - name: tenant-access-db
    plan: free
    postgresMajorVersion: "16"
